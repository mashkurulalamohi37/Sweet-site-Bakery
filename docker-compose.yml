version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ssb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssb_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sweetsite_bakery}
    ports:
      - "5432:5432"
    volumes:
      - ssb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssb_user -d sweetsite_bakery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ssb_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ssb_redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssb_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://ssb_user:ssb_secret_pass_2026@postgres:5432/sweetsite_bakery
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=sweetsite_bakery_super_secret_jwt_key_2026_aesthetic_bakes
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MIN_ORDER_AMOUNT=499
      - WHATSAPP_PHONE=8801852668468
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssb_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ssb_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  ssb_pgdata:
  ssb_redisdata:
